name: Collect Draw Things Dependencies
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        batch: [1, 2, 3, 4, 5]
    steps:
      - name: Fetch pinned sources
        env:
          BATCH: ${{ matrix.batch }}
          GIT_TERMINAL_PROMPT: '0'
          GIT_LFS_SKIP_SMUDGE: '1'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output work
          cat > pins.txt <<'PINS'
          media-generation-kit drawthingsai/media-generation-kit 37e0b70092ad1a0c1d4c6b24f16e17b73f1b1fb3
          draw-things-community drawthingsai/draw-things-community d473a2f148b3e7dc9b90d0b7cfccc5cda999eb66
          ccv liuliu/ccv ae1de9962437c14ff7d84af9bac66305e7ce5927
          dflat liuliu/dflat 73925e51e4f44add842177a229f9990cb13711ff
          flatbuffers google/flatbuffers c92e78a9f841a6110ec27180d68d1f7f2afda21d
          grpc-swift grpc/grpc-swift 5770e231585cb68388a6ae37ce36c4d8dbd46d90
          s4nnc liuliu/s4nnc e3a83b351b84a7917fefd28366a3b9417fee3b2e
          swift-algorithms apple/swift-algorithms 87e50f483c54e6efd60e885f7f5aa946cee68023
          swift-argument-parser apple/swift-argument-parser c5d11a805e765f52ba34ec7284bd4fcd6ba68615
          swift-asn1 apple/swift-asn1 810496cf121e525d660cd0ea89a758740476b85f
          swift-async-algorithms apple/swift-async-algorithms 2971dd5d9f6e0515664b01044826bcea16e59fac
          swift-atomics apple/swift-atomics b601256eab081c0f92f059e12818ac1d4f178ff7
          swift-certificates apple/swift-certificates 24ccdeeeed4dfaae7955fcac9dbf5489ed4f1a25
          swift-collections apple/swift-collections 7b847a3b7008b2dc2f47ca3110d8c782fb2e5c7e
          swift-crypto apple/swift-crypto 95ba0316a9b733e92bb6b071255ff46263bbe7dc
          swift-docc-plugin apple/swift-docc-plugin e977f65879f82b375a044c8837597f690c067da6
          swift-docc-symbolkit swiftlang/swift-docc-symbolkit b45d1f2ed151d057b54504d653e0da5552844e34
          swift-fickling liuliu/swift-fickling 5c982bf479c4cdf8c7f72002cd79ec88b553ab34
          swift-fpzip-support weiyanlin117/swift-fpzip-support 0ec6d4668c9c83bc3da0f8b2d6dfc46da0b98609
          swift-http-structured-headers apple/swift-http-structured-headers 76d7627bd88b47bf5a0f8497dd244885960dde0b
          swift-http-types apple/swift-http-types 45eb0224913ea070ec4fba17291b9e7ecf4749ca
          swift-log apple/swift-log bbd81b6725ae874c69e9b8c8804d462356b55523
          swift-log-datadog jagreenwood/swift-log-datadog e47aa092908764bdd625bb18d72e4db5bf9d7c4e
          swift-nio apple/swift-nio e932d3c4d8f77433c8f7093b5ebcbf91463948a0
          swift-nio-extras apple/swift-nio-extras 3df009d563dc9f21a5c85b33d8c2e34d2e4f8c3b
          swift-nio-http2 apple/swift-nio-http2 b6571f3db40799df5a7fc0e92c399aa71c883edd
          swift-nio-ssl apple/swift-nio-ssl 173cc69a058623525a58ae6710e2f5727c663793
          swift-nio-transport-services apple/swift-nio-transport-services 60c3e187154421171721c1a38e800b390680fb5d
          swift-numerics apple/swift-numerics 0c0290ff6b24942dadb83a929ffaaa1481df04a2
          swift-package-support-sentencepiece weiyanlin117/swift-package-support-sentencepiece a39a5be0b3e3ad9bcb19b085af7dd891c00aa3d2
          swift-png kelvin13/swift-png 075dfb248ae327822635370e9d4f94a5d3fe93b2
          swift-protobuf apple/swift-protobuf d57a5aecf24a25b32ec4a74be2f5d0a995a47c4b
          swift-sentencepiece liuliu/swift-sentencepiece 8d17bf2e017c97563e8805545d676be9739b6c0e
          swift-service-lifecycle swift-server/swift-service-lifecycle 89888196dd79c61c50bca9a103d8114f32e1e598
          swift-system apple/swift-system fbd61a676d79cbde05cd4fda3cc46e94d6b8f0eb
          PINS
          awk -v b="$BATCH" 'NR > (b-1)*7 && NR <= b*7' pins.txt > output/pins.txt
          : > output/STATUS.txt
          while read -r name repo rev; do
            dir="work/$name"
            mkdir -p "$dir"
            if git -C "$dir" init -q &&
               git -C "$dir" -c core.hooksPath=/dev/null fetch --depth=1 --no-tags "https://github.com/$repo.git" "$rev" &&
               git -C "$dir" -c core.hooksPath=/dev/null checkout -q --detach FETCH_HEAD &&
               test "$(git -C "$dir" rev-parse HEAD)" = "$rev"; then
              state=ACQUIRED
              git -C "$dir" ls-tree -r HEAD > "$dir.tree"
              if grep '^160000 ' "$dir.tree" > "output/$name.gitlinks.txt"; then
                state=BLOCKED_SUBMODULE
              else
                rm "output/$name.gitlinks.txt"
              fi
              if git -C "$dir" grep -Il -e '^version https://git-lfs.github.com/spec/v1$' HEAD -- > "output/$name.lfs.txt"; then
                state="${state}_LFS_POINTERS"
              else
                rc=$?
                if [ "$rc" -eq 1 ]; then rm "output/$name.lfs.txt"; else state=BLOCKED_LFS_SCAN; fi
              fi
              if [ ! -f "$dir/Package.swift" ]; then state="${state}_MISSING_MANIFEST"; fi
              if tar -C work --exclude="$name/.git" -czf "output/$name.tar.gz" "$name" && tar -tzf "output/$name.tar.gz" >/dev/null; then
                printf '%s %s %s\n' "$state" "$name" "$rev" | tee -a output/STATUS.txt
              else
                rm -f "output/$name.tar.gz"
                printf 'BLOCKED_ARCHIVE %s %s\n' "$name" "$rev" | tee -a output/STATUS.txt
              fi
            else
              printf 'BLOCKED_FETCH %s %s\n' "$name" "$rev" | tee -a output/STATUS.txt
            fi
          done < output/pins.txt
          (cd output && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
      - name: Upload sources and status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DT-Dependencies-${{ matrix.batch }}
          path: output/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Check acquisition status
        if: always()
        run: |
          test -f output/STATUS.txt
          test "$(grep -c '^ACQUIRED ' output/STATUS.txt || true)" -eq 7
